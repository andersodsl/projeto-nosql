services:
  aerospike:
    image: aerospike/aerospike-server
    container_name: aerospike
    ports:
      - "3000-3002:3000-3002"

  tools:
    image: aerospike/aerospike-tools
    profiles: ["tools"]
    depends_on:
      - aerospike

  absctl:
    image: aerospike/absctl:v1.0.0
    profiles: ["tools"]
    depends_on:
      - aerospike
    volumes:
      - ./backup:/data/backup
